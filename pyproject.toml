[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honyx"
version = "0.1.0"
description = "Reproducibility supervision and verification for coding-agent analyses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Honyx contributors"}]
dependencies = []

[project.scripts]
honyx = "honyx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

