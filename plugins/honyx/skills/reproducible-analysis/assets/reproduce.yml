# GitHub Actions workflow template.
# Copy this file to  .github/workflows/reproduce.yml  at your repository root.
#
# On every push, a blank GitHub-hosted runner checks out only what is committed,
# re-runs the pipeline from the raw inputs, and proves the declared outputs
# regenerate. The reproduction verdict comes from this neutral run — not from the
# author's word. The same run rebuilds the showcase site and publishes it.
#
# Free runners are limited (~2-4 vCPU, ~7-16 GB RAM, ~14 GB disk, no GPU, 6 h/job).
# If the full analysis does not fit, point `runs-on` at a self-hosted or larger
# runner, or reproduce a declared representative subset and say so in the badge.
name: reproduce

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct environment
        run: pip install -r requirements.txt

      - name: Move reference outputs aside
        # Keep only the raw inputs on the field so the pipeline cannot reuse a
        # committed answer; every intermediate and output is regenerated.
        run: mv results reference-outputs

      - name: Re-run the pipeline from raw inputs only
        run: bash run.sh

      - name: Compare regenerated outputs against reference
        run: python3 check.py results reference-outputs

      - name: Build showcase site
        # build_site.py is the package's own analysis-specific showcase builder
        # (adapted from the skill example), not a fixed skill asset.
        run: python3 build_site.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: reproduce
    runs-on: ubuntu-latest
    # Publishes the showcase to GitHub Pages. Enable Pages for the repo
    # (Settings -> Pages -> Source: GitHub Actions) for this to take effect.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
