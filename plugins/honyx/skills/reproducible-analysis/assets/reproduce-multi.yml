# Multi-analysis workflow. Copy to .github/workflows/reproduce.yml at the repo root.
#
# Each analysis under analyses/<slug>/ is a self-contained package, verified
# independently in a matrix job: its declared outputs must regenerate from its raw
# inputs on a fresh clone. Each analysis's run.sh is responsible for its own
# environment (e.g. a venv from pinned requirements). A showcase job then builds
# the combined site (landing page + each analysis's showcase) and publishes it.
#
# List your analyses in the matrix below.
name: reproduce

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        analysis: [analysis-one, analysis-two]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce ${{ matrix.analysis }}
        working-directory: analyses/${{ matrix.analysis }}
        run: |
          mv results reference-outputs
          bash run.sh
          python3 check.py results reference-outputs

  showcase:
    needs: reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the combined site
        run: python3 build_index.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: showcase
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
