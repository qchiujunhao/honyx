# GitHub Actions workflow. Copy to .github/workflows/reproduce.yml at the repo root.
#
# A fresh runner rebuilds the environment, reruns both model paths, compares every
# declared result, and publishes the regenerated showcase. This analysis fits a
# free runner comfortably (569 rows, roughly a minute including installation).
name: reproduce

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Move reference outputs aside
        # Remove the committed answer from the package before re-running.
        run: mv results "$RUNNER_TEMP/reference-outputs"

      - name: Reconstruct env + re-run the pipeline from the raw input
        run: bash run.sh

      - name: Compare regenerated outputs against reference
        run: python3 check.py results "$RUNNER_TEMP/reference-outputs"

      - name: Build showcase site
        # Analysis-specific builder (adapted from the skill example).
        run: python3 build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: reproduce
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
